<aside class="sm-side" aria-label="Workspaces and sessions">
          <div class="sm-side-top">
            <div class="sm-brand">
              <span class="brand-mark" aria-hidden="true">
                <img class="brand-light" src="../logo/LogoLight.svg" alt="">
                <img class="brand-dark" src="../logo/LogoDark.svg" alt="">
              </span>
              <span class="brand-name">Castellan</span>
            </div>
            <button class="sm-navbtn" id="sm-nav-toggle" type="button" aria-label="Collapse workspaces rail" aria-pressed="false" title="Collapse workspaces">«</button>
          </div>

          <div class="sm-newrow">
            <button class="sm-new primary" type="button" data-sm-view="new"><span>+</span> New task</button>
            <button class="sm-new" type="button" data-sm-view="temp-new"><span class="spark">✦</span> Temporary chat</button>
          </div>

          <div class="sm-sec">
            <div class="sm-h"><span>Working</span><button class="sm-h-link" type="button" data-sm-view="working">View all</button></div>
            <div class="sm-row" data-rail-key="auth">
              <button class="sm-item on" type="button" data-sm-view="auth">
                <span class="sm-dot wait"></span>
                <span class="sm-t"><b>Implement authentication</b><small>acme-web · needs you · 4m</small></span>
                <span class="sm-badge">1</span>
              </button>
              <button class="sm-row-archive" type="button" data-archive-confirm="auth" title="Archive task" aria-label="Archive task"><svg class="trash-ico" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.3 3.1h7.4M4.4 3.1V2.1h3.2v1M3.3 3.1l.5 7.3h4.4l.5-7.3M5 5.2v3.1M7 5.2v3.1"/></svg></button>
            </div>
            <div class="sm-row" data-rail-key="rate">
              <button class="sm-item" type="button" data-sm-view="rate">
                <span class="sm-dot" style="background:var(--faint)"></span>
                <span class="sm-t"><b>Rate-limit the public API</b><small>api-core · done · unread</small></span>
                <span class="sm-unread" title="1 unread message"></span>
              </button>
              <button class="sm-row-archive" type="button" data-archive-confirm="rate" title="Archive task" aria-label="Archive task"><svg class="trash-ico" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.3 3.1h7.4M4.4 3.1V2.1h3.2v1M3.3 3.1l.5 7.3h4.4l.5-7.3M5 5.2v3.1M7 5.2v3.1"/></svg></button>
            </div>
          </div>

          <div class="sm-sec sm-ws-sec" id="sm-ws-sec">
            <div class="sm-sec-head">
              <button class="sm-sec-toggle" id="sm-ws-toggle" type="button" aria-expanded="true" aria-controls="sm-ws-list" title="Collapse workspaces">
                <span>Workspaces</span><span class="chev" aria-hidden="true"></span>
              </button>
              <button class="sm-sec-add" id="sm-ws-new" type="button" data-new-workspace="rail" aria-label="New workspace" title="New workspace">＋</button>
            </div>
            <div class="sm-ws-list" id="sm-ws-list">
            <div class="sm-ws-row">
              <button class="sm-ws on" type="button" data-sm-view="dashboard" data-sm-ws="acme-web"><span class="ic">◇</span> acme-web <span class="meta">1 task</span></button>
              <button class="sm-ws-toggle" type="button" data-ws-toggle="acme-web" aria-expanded="true" aria-controls="sm-kids-acme-web" aria-label="Collapse acme-web tasks" title="Collapse acme-web tasks"><span class="chev" aria-hidden="true"></span></button>
              <button class="sm-ws-add" type="button" data-sm-view="new" data-sm-ws="acme-web" aria-label="Add task to acme-web" title="Add task to acme-web">＋</button>
            </div>
            <div class="sm-kids" id="sm-kids-acme-web">
              <div class="sm-task-row" data-rail-key="auth">
                <button class="sm-task on" type="button" data-sm-view="auth"><span class="sm-dot wait"></span> auth-flow <span class="sm-badge">1</span></button>
                <button class="sm-row-archive" type="button" data-archive-confirm="auth" title="Archive task" aria-label="Archive task"><svg class="trash-ico" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.3 3.1h7.4M4.4 3.1V2.1h3.2v1M3.3 3.1l.5 7.3h4.4l.5-7.3M5 5.2v3.1M7 5.2v3.1"/></svg></button>
              </div>
            </div>
            <div class="sm-ws-row">
              <button class="sm-ws" type="button" data-sm-view="dashboard" data-sm-ws="api-core"><span class="ic">◇</span> api-core <span class="meta">unread</span></button>
              <button class="sm-ws-toggle" type="button" data-ws-toggle="api-core" aria-expanded="true" aria-controls="sm-kids-api-core" aria-label="Collapse api-core tasks" title="Collapse api-core tasks"><span class="chev" aria-hidden="true"></span></button>
              <button class="sm-ws-add" type="button" data-sm-view="new" data-sm-ws="api-core" aria-label="Add task to api-core" title="Add task to api-core">＋</button>
            </div>
            <div class="sm-kids" id="sm-kids-api-core">
              <div class="sm-task-row" data-rail-key="rate">
                <button class="sm-task" type="button" data-sm-view="rate"><span class="sm-unread" style="margin:0"></span> rate-limit</button>
                <button class="sm-row-archive" type="button" data-archive-confirm="rate" title="Archive task" aria-label="Archive task"><svg class="trash-ico" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.3 3.1h7.4M4.4 3.1V2.1h3.2v1M3.3 3.1l.5 7.3h4.4l.5-7.3M5 5.2v3.1M7 5.2v3.1"/></svg></button>
              </div>
            </div>
            <div class="sm-ws-row">
              <button class="sm-ws" type="button" data-sm-view="dashboard" data-sm-ws="shop"><span class="ic">◇</span> shop <span class="meta">idle</span></button>
              <button class="sm-ws-add" type="button" data-sm-view="new" data-sm-ws="shop" aria-label="Add task to shop" title="Add task to shop">＋</button>
            </div>
            <div class="sm-ws-row">
              <button class="sm-ws" type="button" data-sm-view="dashboard" data-sm-ws="docs"><span class="ic">◇</span> docs <span class="meta">idle</span></button>
              <button class="sm-ws-add" type="button" data-sm-view="new" data-sm-ws="docs" aria-label="Add task to docs" title="Add task to docs">＋</button>
            </div>
            </div>
          </div>

          <div class="sm-sec sm-temp-sec" id="sm-temp-sec">
            <div class="sm-sec-head">
              <button class="sm-sec-toggle" id="sm-temp-toggle" type="button" aria-expanded="true" aria-controls="sm-temp-list" title="Collapse temporary">
                <span>Temporary</span><span class="chev" aria-hidden="true"></span>
              </button>
              <button class="sm-sec-add" id="sm-temp-new" type="button" data-sm-view="temp-new" aria-label="New temporary chat" title="New temporary chat">＋</button>
            </div>
            <div class="sm-temp-list" id="sm-temp-list">
            <div class="sm-row" data-rail-key="temp">
              <button class="sm-item" type="button" data-sm-view="temp">
                <span class="sm-dot" style="background:var(--blue)"></span>
                <span class="sm-t"><b>Explain this stack trace</b><small>2m · no workspace</small></span>
              </button>
              <button class="sm-row-archive" type="button" data-archive-confirm="temp" title="Archive chat" aria-label="Archive chat"><svg class="trash-ico" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.3 3.1h7.4M4.4 3.1V2.1h3.2v1M3.3 3.1l.5 7.3h4.4l.5-7.3M5 5.2v3.1M7 5.2v3.1"/></svg></button>
            </div>
            </div>
          </div>

          <button class="sm-archive-link" type="button" data-sm-view="archived">
            <span class="ic"><svg class="trash-ico" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.3 3.1h7.4M4.4 3.1V2.1h3.2v1M3.3 3.1l.5 7.3h4.4l.5-7.3M5 5.2v3.1M7 5.2v3.1"/></svg></span>
            <span>Archive</span>
            <span class="count" id="sm-archive-count">0</span>
          </button>

          <div class="sm-foot">
            <button class="sm-profile" id="sm-profile-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="sm-profile-pop" title="Open settings">
              <span class="av">M</span><span class="sm-profile-name">Manuel</span>
            </button>
            <span class="live-dot">runner online</span>
          </div>
        </aside>
