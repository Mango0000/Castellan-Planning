<aside class="sm-side" aria-label="Workspaces and sessions">
          <div class="sm-side-top">
            <div class="sm-brand">
              <span class="brand-mark" aria-hidden="true">
                <img class="brand-light" src="../logo/LogoLight.svg" alt="">
                <img class="brand-dark" src="../logo/LogoDark.svg" alt="">
              </span>
              <span class="brand-name">Castellan</span>
            </div>
            <button class="sm-navbtn sm-theme-btn" id="sm-theme-toggle" type="button" aria-label="Switch to dark theme" aria-pressed="false" title="Switch to dark theme">☾</button>
            <button class="sm-navbtn" id="sm-nav-toggle" type="button" aria-label="Collapse workspaces rail" aria-pressed="false" title="Collapse workspaces">«</button>
          </div>
          <div class="sm-side-stub">
            <button class="sm-stub-logo" id="sm-nav-expand" type="button" aria-label="Expand Castellan rail" title="Expand Castellan rail">
              <img class="stub-logo-light" src="../logo/LogoLight.svg" alt="">
              <img class="stub-logo-dark" src="../logo/LogoDark.svg" alt="">
            </button>
          </div>

          <div class="sm-newrow">
            <button class="sm-new primary" type="button" data-sm-view="new"><span>+</span> New task</button>
            <button class="sm-new" type="button" data-sm-view="temp-new"><span class="spark">✦</span> Temporary chat</button>
          </div>

          <div class="sm-sec">
            <div class="sm-h"><span>Working</span><button class="sm-h-link" type="button" data-sm-view="working">View all</button></div>
            <div class="sm-row" data-rail-key="auth">
              <button class="sm-item on" type="button" data-sm-view="auth">
                <span class="sm-dot wait"></span>
                <span class="sm-t"><b>Implement authentication</b><small>acme-web · needs you · 4m</small></span>
                <span class="sm-badge">1</span>
              </button>
              <button class="sm-row-archive" type="button" data-archive-confirm="auth" title="Archive task" aria-label="Archive task">⇩</button>
            </div>
            <div class="sm-row" data-rail-key="rate">
              <button class="sm-item" type="button" data-sm-view="rate">
                <span class="sm-dot" style="background:var(--faint)"></span>
                <span class="sm-t"><b>Rate-limit the public API</b><small>api-core · done · unread</small></span>
                <span class="sm-unread" title="1 unread message"></span>
              </button>
              <button class="sm-row-archive" type="button" data-archive-confirm="rate" title="Archive task" aria-label="Archive task">⇩</button>
            </div>
          </div>

          <div class="sm-sec sm-ws-sec" id="sm-ws-sec">
            <button class="sm-sec-toggle" id="sm-ws-toggle" type="button" aria-expanded="true" aria-controls="sm-ws-list" title="Collapse workspaces">
              <span>Workspaces</span><span class="chev" aria-hidden="true">▾</span>
            </button>
            <div class="sm-ws-list" id="sm-ws-list">
            <button class="sm-ws on" type="button" data-sm-view="dashboard" data-sm-ws="acme-web"><span class="ic">◇</span> acme-web <span class="meta">1 task</span></button>
            <div class="sm-kids">
              <div class="sm-task-row" data-rail-key="auth">
                <button class="sm-task on" type="button" data-sm-view="auth"><span class="sm-dot wait"></span> auth-flow <span class="sm-badge">1</span></button>
                <button class="sm-row-archive" type="button" data-archive-confirm="auth" title="Archive task" aria-label="Archive task">⇩</button>
              </div>
            </div>
            <button class="sm-ws" type="button" data-sm-view="dashboard" data-sm-ws="api-core"><span class="ic">◇</span> api-core <span class="meta">unread</span></button>
            <div class="sm-kids">
              <div class="sm-task-row" data-rail-key="rate">
                <button class="sm-task" type="button" data-sm-view="rate"><span class="sm-unread" style="margin:0"></span> rate-limit</button>
                <button class="sm-row-archive" type="button" data-archive-confirm="rate" title="Archive task" aria-label="Archive task">⇩</button>
              </div>
            </div>
            <button class="sm-ws" type="button" data-sm-view="dashboard" data-sm-ws="shop"><span class="ic">◇</span> shop <span class="meta">idle</span></button>
            <button class="sm-ws" type="button" data-sm-view="dashboard" data-sm-ws="docs"><span class="ic">◇</span> docs <span class="meta">idle</span></button>
            </div>
          </div>

          <div class="sm-sec">
            <div class="sm-h"><span>Temporary</span></div>
            <div class="sm-row" data-rail-key="temp">
              <button class="sm-item" type="button" data-sm-view="temp">
                <span class="sm-dot" style="background:var(--blue)"></span>
                <span class="sm-t"><b>Explain this stack trace</b><small>2m · no workspace</small></span>
              </button>
              <button class="sm-row-archive" type="button" data-archive-confirm="temp" title="Archive chat" aria-label="Archive chat">⇩</button>
            </div>
          </div>

          <button class="sm-archive-link" type="button" data-sm-view="archived">
            <span class="ic">⇩</span>
            <span>Archive</span>
            <span class="count" id="sm-archive-count">0</span>
          </button>

          <div class="sm-foot"><span class="av">M</span> Manuel <span class="live-dot">runner online</span></div>
        </aside>
